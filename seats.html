<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats - CineBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Cine<span>Book</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="booking.html">Back</a>
    </nav>
    <button class="logout-btn" id="logoutButton" onclick="logoutUser()" hidden>Sign out</button>
</header>

<section class="page-section">
    <div class="section-title">
        <p>CHOOSE YOUR SEATS</p>
        <h2>Select Seats</h2>
    </div>

    <div class="seat-container">
        <div class="screen">SCREEN</div>

        <div class="seat-info">
            <span><i class="available"></i> Available</span>
            <span><i class="selected"></i> Selected</span>
            <span><i class="occupied"></i> Occupied</span>
            <span><i class="available" style="box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 15px rgba(229, 9, 20, 0.8); border: 1px solid white;"></i> Best Seats</span>
        </div>

        <div class="seats" id="seats"></div>

        <div class="seat-summary">
            <div>
                <p>Selected Seats</p>
                <h3 id="selectedSeats">None</h3>
            </div>
            <div>
                <p>Total</p>
                <h3>₹<span id="seatTotal">0</span></h3>
            </div>
            <button onclick="goToPayment()">Continue →</button>
        </div>
    </div>
</section>

<script src="script.js?v=1791125840585"></script>
<script>createSeats();</script>
</body>
</html>
