<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout {
            display: flex;
            min-height: 100vh;
            background-color: #0f0f13;
        }
        .admin-sidebar {
            width: 250px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-right: 1px solid #0f3460;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .admin-sidebar .logo {
            font-size: 24px;
            margin-bottom: 40px;
        }
        .admin-nav a {
            display: block;
            color: #ccc;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 500;
            transition: 0.3s;
        }
        .admin-nav a:hover, .admin-nav a.active {
            background: rgba(229, 9, 20, 0.2);
            color: #e50914;
        }
        .admin-content {
            flex: 1;
            padding: 40px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .admin-header h1 {
            margin: 0;
            color: #fff;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #151515;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .stat-card h3 {
            color: #888;
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #151515;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
            color: #ccc;
        }
        th {
            background: #1a1a2e;
            color: #e50914;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="admin-sidebar">
            <div class="logo">Cine<span>Admin</span></div>
            <nav class="admin-nav">
                <a href="#" class="active">Dashboard Stats</a>
                <a href="#" onclick="alert('Manage Movies coming soon!')">Manage Movies</a>
                <a href="#" onclick="alert('Manage Users coming soon!')">Manage Users</a>
            </nav>
            <button class="logout-btn" style="margin-top: auto;" onclick="logoutUser()">Sign out</button>
        </div>
        
        <div class="admin-content">
            <div class="admin-header">
                <h1>Overview</h1>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Bookings</h3>
                    <div class="value" id="statBookings">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <div class="value" id="statRevenue">₹0</div>
                </div>
                <div class="stat-card">
                    <h3>Registered Users</h3>
                    <div class="value" id="statUsers">1</div>
                </div>
            </div>

            <h2 style="color: #fff; margin-bottom: 20px;">Recent Global Bookings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>User Email</th>
                        <th>Movie</th>
                        <th>Date & Time</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="adminBookingsTable">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js?v=admin"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Protect Admin Page
            if (localStorage.getItem("cinebookRole") !== "admin") {
                window.location.href = "login.html";
                return;
            }
            
            // Load global bookings
            const globalBookings = JSON.parse(localStorage.getItem("cinebookGlobalBookings")) || [];
            
            // Update Stats
            document.getElementById("statBookings").innerText = globalBookings.length;
            const revenue = globalBookings.reduce((sum, b) => b.status !== "CANCELLED" ? sum + b.total : sum, 0);
            document.getElementById("statRevenue").innerText = "₹" + revenue;
            
            // Populate Table
            const tbody = document.getElementById("adminBookingsTable");
            globalBookings.reverse().forEach(b => {
                const tr = document.createElement("tr");
                tr.innerHTML = \`
                    <td>\${b.id}</td>
                    <td>\${b.email || "Unknown"}</td>
                    <td>\${b.movie}</td>
                    <td>\${b.date} | \${b.time}</td>
                    <td>₹\${b.total}</td>
                    <td style="color: \${b.status === "CANCELLED" ? "#888" : "#28a745"}">\${b.status || "CONFIRMED"}</td>
                \`;
                tbody.appendChild(tr);
            });
            
            if(globalBookings.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>No bookings yet</td></tr>";
            }
        });
    </script>
</body>
</html>
